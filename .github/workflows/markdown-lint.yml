name: markdown-lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/_archive/**
            !**/node_modules/**
      - name: Plain-English failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'markdown-lint found issues in this PR.',
              '',
              'Each issue is reported by file and line above. To fix:',
              '- Heading missing blank line after it → add a blank line.',
              '- List uses `*` instead of `-` → change to `-`.',
              '- Code fence not closed → add closing ```.',
              '',
              'If you are unsure, ask the Domain Lead for help. The full rule set is in `.markdownlint.jsonc`.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
