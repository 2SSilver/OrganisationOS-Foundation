name: back-flow-rules

# Pattern A only — enforces the back-flow operational defences from v3.1 §8:
# the 500-line cap and 24-hour cool-off apply to every PR labelled
# `back-flow`, human- or agent-initiated alike.
#
# Agent-initiated back-flow ban (v3.1 §8, unchanged by v3.2). The ban is a
# session-mount-state condition, not an authorship-within-session claim: a
# commit made while --add-dir included a non-harness path fails CI. Caught by
# a session-id field in the PR template plus a hook that tags commits made
# under that condition (§8) — not by anything in this workflow. TODO: no such
# hook ships in these templates yet. Until it does, the agent-initiated ban
# is enforced by the session-id field plus reviewer judgement during the
# two-reviewer back-flow review (§8), not by an automated CI check here.
#
# v3.2 §8/§16 carve-out: a human-initiated, `back-flow`-labelled PR carrying
# only the Markdown source of a client-facing deliverable is permitted
# through the same two gates below. This workflow does not add a separate
# format check for the carve-out — a blanket Markdown-only check would also
# apply to every other `back-flow` PR, and v3.1 §8 already anticipates a
# back-flow PR carrying non-Markdown formats FORMATS.md permits (e.g. a PDF
# anonymised report). The source-only expectation for the carve-out is
# confirmed by the two reviewers during back-flow review, not by CI.
# Applies to PRs labelled `back-flow`.

on:
  workflow_call:

jobs:
  back-flow:
    if: contains(github.event.pull_request.labels.*.name, 'back-flow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce 500-line cap on back-flow PRs
        run: |
          set -e
          added=$(git diff --shortstat "origin/${{ github.base_ref }}...HEAD" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          if [ "$added" -gt 500 ]; then
            echo "::error::Back-flow PR adds $added lines (cap: 500). Split into multiple PRs, each reviewed independently. See v3.1 §8."
            exit 1
          fi
      - name: Enforce 24-hour cool-off
        run: |
          set -e
          created="${{ github.event.pull_request.created_at }}"
          created_ts=$(date -d "$created" +%s)
          now_ts=$(date +%s)
          age=$((now_ts - created_ts))
          if [ "$age" -lt 86400 ]; then
            echo "::error::Back-flow PR cannot be merged within 24 hours of opening. Wait until $(date -d "@$((created_ts + 86400))"). See v3.1 §8."
            # Note: this prevents merge by failing required check; reviewers can still review during cool-off.
            exit 1
          fi
      - name: Plain-English comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'This `back-flow` PR was blocked by one of the operational defences (v3.1 §8):',
              '- Back-flow PRs add ≤500 net new lines.',
              '- Back-flow PRs cannot be merged within 24h of opening (Domain Lead reading time).',
              '',
              'The agent-initiated back-flow ban (§8) and the v3.2 human-initiated, source-only carve-out are not checked by this workflow — they rely on the session-id PR-template field and the two-reviewer back-flow review.',
              '',
              'If the change is genuinely large, split it. If it is genuinely urgent, raise it with the Admin.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
